name: Verify RoutineNest
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install Android build SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Compile, test and lint Android
        run: bash gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:lintRelease :app:assembleRelease
      - name: Test localisation, persistence schema and receipt policy
        run: |
          python -m pip install -r scripts/requirements.txt
          python scripts/test_localization.py
          python scripts/test_database_schema.py
          python scripts/test_rvs.py
          node --test supabase/functions/routinenest-verify-receipt/handler.test.mjs
          python scripts/validate_translations.py
          python scripts/release_check.py
      - name: Preserve candidate APKs and verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-candidates-and-reports
          retention-days: 14
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/
            core/build/reports/
            docs/release-evidence.json
            docs/python-test-evidence.json
            localization/reports/
